# Server Configuration
server.port=${PORT:5001}

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:1000}

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# File Upload Configuration
# Storage type: local or gridfs (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
# 500명 규모의 순간 접속 burst 대비. 라이브러리 기본(10)은 그 이상 몰리면 로그 없이
# 조용히 거부되므로 올린다. tcp-no-delay는 Nagle 지연을 없애 실시간 메시지 응답성을 높인다.
socketio.server.accept-backlog=${SOCKETIO_SERVER_ACCEPT_BACKLOG:1024}
socketio.server.tcp-no-delay=${SOCKETIO_SERVER_TCP_NO_DELAY:true}
# 0 = corundum-socketio 라이브러리 기본값(Netty 기준 CPU 코어 수 * 2) 그대로 사용.
# 실측 근거 없이 임의로 올리지 않고, 필요 시 배포 환경에서만 조정한다.
socketio.server.boss-threads=${SOCKETIO_SERVER_BOSS_THREADS:0}
socketio.server.worker-threads=${SOCKETIO_SERVER_WORKER_THREADS:0}

# Redisson 커넥션 풀. 기본값은 라이브러리 기본값과 동일(64/24/50) — 실측 없이 올리지 않고
# 배포 환경에서 병목이 확인되면 이 값들만 조정한다.
redisson.connection-pool-size=${REDISSON_CONNECTION_POOL_SIZE:64}
redisson.connection-minimum-idle-size=${REDISSON_CONNECTION_MIN_IDLE_SIZE:24}
redisson.subscription-connection-pool-size=${REDISSON_SUBSCRIPTION_POOL_SIZE:50}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# 채팅방 목록의 "최근 활동" 표시 갱신 최소 간격 (ms). 메시지마다 매번 갱신하지 않고
# 방 하나당 이 간격으로만 MongoDB count + room-list 브로드캐스트를 내보낸다.
chatapp.room-activity.throttle-ms=${ROOM_ACTIVITY_THROTTLE_MS:3000}

# 채팅방 목록 조회 시 한 번에 가져오는 최대 방 개수(최신순). 반복되는 부하테스트로 방이
# 계속 쌓여도 목록 조회 비용이 방 개수에 비례해 커지지 않도록 상한을 둔다.
chatapp.room-list.max-size=${ROOM_LIST_MAX_SIZE:200}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}
