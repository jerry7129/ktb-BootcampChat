name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - frontend
          - backend
      hosts:
        description: 'Optional JSON inventory for this deployment only; empty uses EC2_HOSTS'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FRONTEND_DEPLOY_ROOT: /home/${{ vars.EC2_USERNAME }}/ktb-chat-frontend
  BACKEND_DEPLOY_ROOT: /home/${{ vars.EC2_USERNAME }}/ktb-chat-backend

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend_hosts: ${{ steps.hosts.outputs.frontend_hosts }}
      backend_hosts: ${{ steps.hosts.outputs.backend_hosts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend and backend changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail

          frontend=false
          backend=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$COMPONENT" in
              both)
                frontend=true
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              *)
                echo "Unsupported component: $COMPONENT" >&2
                exit 1
                ;;
            esac
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA")"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            fi

            echo "Changed files:"
            printf '%s\n' "$changed_files"

            if grep -Eq '^(apps/frontend/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)' <<<"$changed_files"; then
              frontend=true
            fi

            if grep -Eq '^apps/backend/' <<<"$changed_files"; then
              backend=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Deploy frontend: $frontend"
          echo "Deploy backend: $backend"

      - name: Validate deployment hosts
        id: hosts
        shell: bash
        env:
          TARGET_HOSTS: ${{ inputs.hosts || vars.EC2_HOSTS }}
        run: |
          set -euo pipefail
          : "${TARGET_HOSTS:?Provide hosts input or configure repository variable EC2_HOSTS}"

          # Supported forms:
          #   Shared fleet: ["host-1", "host-2"]
          #   Separate fleets: {"frontend":["host-1"],"backend":["host-2","host-3"]}
          normalized="$({
            jq -ce '
              if type == "array" then
                {frontend: ., backend: .}
              elif type == "object"
                   and (.frontend | type == "array")
                   and (.backend | type == "array") then
                {frontend: .frontend, backend: .backend}
              else
                error("EC2_HOSTS must be a JSON array or an object with frontend/backend arrays")
              end
            ' <<<"$TARGET_HOSTS"
          })"

          frontend_hosts="$(jq -ce '.frontend' <<<"$normalized")"
          backend_hosts="$(jq -ce '.backend' <<<"$normalized")"

          if [[ "${{ steps.changes.outputs.frontend }}" == "true" ]] && [[ "$(jq 'length' <<<"$frontend_hosts")" -eq 0 ]]; then
            echo "EC2_HOSTS.frontend must contain at least one host" >&2
            exit 1
          fi

          if [[ "${{ steps.changes.outputs.backend }}" == "true" ]] && [[ "$(jq 'length' <<<"$backend_hosts")" -eq 0 ]]; then
            echo "EC2_HOSTS.backend must contain at least one host" >&2
            exit 1
          fi

          echo "frontend_hosts=$frontend_hosts" >> "$GITHUB_OUTPUT"
          echo "backend_hosts=$backend_hosts" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir apps/frontend test

      - name: Lint frontend
        run: pnpm --dir apps/frontend lint

      - name: Create production environment
        shell: bash
        env:
          API_URL: ${{ vars.FRONTEND_API_URL }}
          SOCKET_URL: ${{ vars.FRONTEND_SOCKET_URL }}
          CLOUDFRONT_URL: ${{ vars.FRONTEND_CLOUDFRONT_URL || 'https://d2nsun7j7a460i.cloudfront.net' }}
        run: |
          set -euo pipefail
          : "${API_URL:?Repository variable FRONTEND_API_URL is required}"
          : "${SOCKET_URL:?Repository variable FRONTEND_SOCKET_URL is required}"

          rm -f apps/frontend/.env.local
          printf 'NEXT_PUBLIC_API_URL=%s\nNEXT_PUBLIC_SOCKET_URL=%s\nNEXT_PUBLIC_CLOUDFRONT_URL=%s\n' \
            "$API_URL" "$SOCKET_URL" "$CLOUDFRONT_URL" > apps/frontend/.env.production

      - name: Build standalone frontend
        run: pnpm --dir apps/frontend run build:production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Upload Next.js static assets to S3
        env:
          FRONTEND_STATIC_BUCKET: ${{ vars.FRONTEND_STATIC_BUCKET }}
        run: |
          set -euo pipefail
          : "${FRONTEND_STATIC_BUCKET:?Repository variable FRONTEND_STATIC_BUCKET is required}"

          aws s3 sync \
            apps/frontend/.next/static/ \
            "s3://${FRONTEND_STATIC_BUCKET}/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Package frontend release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/frontend
          cp -a apps/frontend/.next/standalone/. dist/frontend/

          mkdir -p dist/frontend/apps/frontend/.next
          cp -a apps/frontend/.next/static \
            dist/frontend/apps/frontend/.next/static

          cp -a apps/frontend/public \
            dist/frontend/apps/frontend/public

          install -m 755 apps/frontend/restart.sh dist/frontend/restart.sh
          tar -C dist/frontend -czf frontend-release.tar.gz .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}
          path: frontend-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test backend
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package

      - name: Package backend release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/backend/target
          install -m 644 \
            apps/backend/target/ktb-chat-backend-0.0.1-SNAPSHOT.jar \
            dist/backend/target/ktb-chat-backend-0.0.1-SNAPSHOT.jar
          install -m 755 apps/backend/app-control.sh dist/backend/app-control.sh
          tar -C dist/backend -czf backend-release.tar.gz .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: backend-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend to ${{ matrix.host }}
    needs:
      - changes
      - build-frontend
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.changes.outputs.frontend_hosts) }}
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PEM }}
          DEPLOY_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Repository secret PEM is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          if ! timeout 15 bash -c ">/dev/tcp/$DEPLOY_HOST/22"; then
            echo "Cannot reach $DEPLOY_HOST:22 from this GitHub runner." >&2
            echo "Verify the EC2 public address, SSH security-group rule, route, and sshd." >&2
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
            echo "SSH is reachable but its host key could not be read from $DEPLOY_HOST." >&2
            exit 1
          fi

      - name: Upload and activate frontend release
        shell: bash
        env:
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_USER: ${{ vars.EC2_USERNAME }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?Repository variable EC2_USERNAME is required}"

          remote_archive="/tmp/ktb-frontend-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/id_ec2 frontend-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"

          ssh -i ~/.ssh/id_ec2 "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' -- "$FRONTEND_DEPLOY_ROOT" "$GITHUB_SHA" "$remote_archive" <<'REMOTE'
          set -euo pipefail
          deploy_root="$1"
          release_id="$2"
          archive="$3"
          release_dir="$deploy_root/releases/$release_id"
          previous_release=""
          if [[ -L "$deploy_root/current" ]]; then
            candidate="$(readlink -e "$deploy_root/current" 2>/dev/null || true)"
            if [[ "$candidate" == "$deploy_root/releases/"* && -d "$candidate" ]]; then
              previous_release="$candidate"
            else
              echo "Ignoring invalid current symlink before frontend deployment." >&2
            fi
          elif [[ -e "$deploy_root/current" ]]; then
            echo "$deploy_root/current exists but is not a symlink; refusing to overwrite it." >&2
            exit 1
          fi

          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          rm -f "$archive"
          chmod +x "$release_dir/restart.sh"

          ln -sfn "$release_dir" "$deploy_root/current.next"
          mv -Tf "$deploy_root/current.next" "$deploy_root/current"

          if ! (cd "$deploy_root/current" && ./restart.sh); then
            echo "Frontend service diagnostics:" >&2
            systemctl status ktb-frontend.service --no-pager --lines=100 || true
            tail -n 100 "$deploy_root/logs/systemd.log" || true
            if [[ -n "$previous_release" && -d "$previous_release" ]]; then
              echo "Frontend restart failed; rolling back to $previous_release" >&2
              ln -sfn "$previous_release" "$deploy_root/current.next"
              mv -Tf "$deploy_root/current.next" "$deploy_root/current"
              (cd "$deploy_root/current" && ./restart.sh) || true
            fi
            exit 1
          fi
          REMOTE

  deploy-backend:
    name: Deploy backend to ${{ matrix.host }}
    needs:
      - changes
      - build-backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.changes.outputs.backend_hosts) }}
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release-${{ github.sha }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PEM }}
          DEPLOY_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Repository secret PEM is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          if ! timeout 15 bash -c ">/dev/tcp/$DEPLOY_HOST/22"; then
            echo "Cannot reach $DEPLOY_HOST:22 from this GitHub runner." >&2
            echo "Verify the EC2 public address, SSH security-group rule, route, and sshd." >&2
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
            echo "SSH is reachable but its host key could not be read from $DEPLOY_HOST." >&2
            exit 1
          fi

      - name: Upload backend environment
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_USER: ${{ vars.EC2_USERNAME }}
        run: |
          set -euo pipefail
          : "${BACKEND_ENV:?Repository secret BACKEND_ENV is required}"
          : "${DEPLOY_USER:?Repository variable EC2_USERNAME is required}"

          local_env="$(mktemp)"
          trap 'rm -f "$local_env"' EXIT
          chmod 600 "$local_env"
          printf '%s\n' "$BACKEND_ENV" > "$local_env"

          remote_env="/tmp/ktb-backend-${GITHUB_SHA}.env"
          scp -i ~/.ssh/id_ec2 "$local_env" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_env"

      - name: Upload and activate backend release
        shell: bash
        env:
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_USER: ${{ vars.EC2_USERNAME }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?Repository variable EC2_USERNAME is required}"

          remote_archive="/tmp/ktb-backend-${GITHUB_SHA}.tar.gz"
          remote_env="/tmp/ktb-backend-${GITHUB_SHA}.env"
          scp -i ~/.ssh/id_ec2 backend-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"

          ssh -i ~/.ssh/id_ec2 "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' -- \
            "$BACKEND_DEPLOY_ROOT" "$GITHUB_SHA" "$remote_archive" "$remote_env" <<'REMOTE'
          set -euo pipefail
          deploy_root="$1"
          release_id="$2"
          archive="$3"
          environment_file="$4"
          release_dir="$deploy_root/releases/$release_id"
          previous_release=""
          previous_environment=""

          cleanup() {
            rm -f "$archive" "$environment_file"
            if [[ -n "$previous_environment" ]]; then
              rm -f "$previous_environment"
            fi
          }
          trap cleanup EXIT

          if [[ ! -s "$environment_file" ]]; then
            echo "Uploaded backend environment file is missing or empty." >&2
            exit 1
          fi

          if [[ -L "$deploy_root/current" ]]; then
            candidate="$(readlink -e "$deploy_root/current" 2>/dev/null || true)"
            if [[ "$candidate" == "$deploy_root/releases/"* && -d "$candidate" ]]; then
              previous_release="$candidate"
            else
              echo "Ignoring invalid current symlink before backend deployment." >&2
            fi
          elif [[ -e "$deploy_root/current" ]]; then
            echo "$deploy_root/current exists but is not a symlink; refusing to overwrite it." >&2
            exit 1
          fi

          mkdir -p "$release_dir/logs" "$deploy_root/uploads"
          tar -xzf "$archive" -C "$release_dir"
          chmod +x "$release_dir/app-control.sh"

          if [[ -f "$deploy_root/.env" ]]; then
            previous_environment="$(mktemp "$deploy_root/.env.rollback.XXXXXX")"
            cp -p "$deploy_root/.env" "$previous_environment"
          fi

          install -m 600 "$environment_file" "$deploy_root/.env.next"
          mv -f "$deploy_root/.env.next" "$deploy_root/.env"
          ln -sfn "$deploy_root/.env" "$release_dir/.env"
          ln -sfn "$deploy_root/uploads" "$release_dir/uploads"

          ln -sfn "$release_dir" "$deploy_root/current.next"
          mv -Tf "$deploy_root/current.next" "$deploy_root/current"

          if ! (cd "$deploy_root/current" && ./app-control.sh restart); then
            echo "Backend service diagnostics:" >&2
            systemctl status ktb-backend.service --no-pager --lines=100 || true
            tail -n 100 "$deploy_root/logs/systemd.log" || true
            if [[ -n "$previous_release" && -d "$previous_release" ]]; then
              echo "Backend restart failed; rolling back to $previous_release" >&2
              if [[ -n "$previous_environment" && -f "$previous_environment" ]]; then
                cp -p "$previous_environment" "$deploy_root/.env.next"
                mv -f "$deploy_root/.env.next" "$deploy_root/.env"
              fi
              ln -sfn "$previous_release" "$deploy_root/current.next"
              mv -Tf "$deploy_root/current.next" "$deploy_root/current"
              (cd "$deploy_root/current" && ./app-control.sh restart) || true
            fi
            exit 1
          fi
          REMOTE
